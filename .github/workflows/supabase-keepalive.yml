# Supabase ücretsiz planda 7 gün hiç istek gelmeyen projeler duraklatılır.
# Bu iş akışı haftada iki kez basit bir sorgu atarak projeyi uyanık tutar.
name: Supabase keepalive

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL tanımlı değil, atlanıyor."; exit 0; fi
          curl -fsS "$SUPABASE_URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" > /dev/null
          echo "Supabase uyanık."
